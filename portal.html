<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal · Jason Carneal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="static/favicon64.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="auth/config.js"></script>
  <script src="auth/auth.js"></script>
  <script>window.__user = SiteAuth.requireAuth();</script>

<style>
:root{
  --bg:#F4F7F9; --surface:#FFFFFF; --ink:#12232F; --ink-2:#3E5566; --ink-3:#7A8E9C;
  --line:#D8E0E6; --accent:#1F7AE0; --accent-ink:#0E4E9B; --glow:rgba(31,122,224,.14);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0C161F; --surface:#122230; --ink:#E6EEF4; --ink-2:#B3C2CE; --ink-3:#7F94A5;
  --line:#24384A; --accent:#4FA3FF; --accent-ink:#9CCBFF; --glow:rgba(79,163,255,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1080px;margin:0 auto;padding:22px 24px}
.brand{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.brand b{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;color:var(--accent);font-weight:500;letter-spacing:0}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);min-width:0}
.who #email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;white-space:nowrap;transition:border-color .15s}
.btn:hover{border-color:var(--accent)}
.icon{width:36px;height:36px;padding:0;display:grid;place-items:center}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon .sun{display:none}
[data-theme="dark"] .icon .sun{display:block}
[data-theme="dark"] .icon .moon{display:none}

main{max-width:1080px;margin:0 auto;padding:24px 24px 64px}
h1{margin:0;font-size:clamp(26px,3vw,34px);font-weight:600;letter-spacing:-.015em}
.lede{margin:6px 0 32px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,box-shadow .2s,transform .15s}
a.tile:hover{border-color:var(--accent);box-shadow:0 10px 30px var(--glow);transform:translateY(-2px)}
.tile .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--glow);color:var(--accent)}
.tile .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile h2{margin:0;font-size:17px;font-weight:600}
.tile p{margin:0;font-size:14px;color:var(--ink-2)}
.tile .go{margin-top:auto;padding-top:6px;font-size:13px;font-weight:500;color:var(--accent-ink)}
.tile.soon{border-style:dashed;background:transparent}
.tile.soon .ic{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
.tile.soon h2,.tile.soon p{color:var(--ink-3)}

@media (max-width:600px){
  .top{padding:16px}
  main{padding:12px 16px 48px}
  .who #email{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>JC</b>Portal</div>
  <div class="who">
    <span id="email"></span>
    <button class="btn icon" id="theme" type="button" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn" id="signout" type="button">Sign out</button>
  </div>
</header>

<main>
  <h1 id="hello">Welcome</h1>
  <p class="lede">Choose where to go.</p>
  <div class="grid" id="apps"></div>
</main>

<script>
/* ------------------------------------------------------------------
   Add new functions here. Private pages: put the file in private/,
   run scripts/upload-private.mjs, and link it as view.html?p=<path>.
------------------------------------------------------------------ */
const APPS = [
  { title: 'Resume', desc: 'Interactive CV — experience, skills, projects and publications.', href: 'view.html?p=resume.html',
    icon: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>' },
  { title: 'Efficiencies Realized', desc: 'FY26 time savings from automation, visualization and AI-assisted analysis.', href: 'view.html?p=efficiencies-realized.html',
    icon: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>' },
  { title: 'Workload Balancer', desc: 'Personal browser-based work balancing tool.', href: 'https://workloadbalancer.netlify.app/',
    icon: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>' },
  { title: 'Project 42', desc: 'Workout and fasting planner browser-based with sign-in, contact me for access to save data.', href: 'https://42program.netlify.app/',
    icon: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>' },
  { title: 'Future Planner', desc: 'Browser-based tool to plan for your financial future, no data saved - allows you to save and load data locally.', href: 'https://cashflush.netlify.app/',
    icon: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>' },
  { title: 'More coming soon', desc: 'New tools will appear here.', soon: true,
    icon: '<path d="M12 5v14M5 12h14"/>' },
];

(() => {
  const root = document.documentElement;
  const saved = (() => { try { return localStorage.getItem('cv-theme'); } catch { return null; } })();
  if (saved) root.dataset.theme = saved;
  else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
  document.getElementById('theme').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('cv-theme', root.dataset.theme); } catch {}
  });

  const grid = document.getElementById('apps');
  for (const app of APPS) {
    const el = document.createElement(app.soon ? 'div' : 'a');
    el.className = 'tile' + (app.soon ? ' soon' : '');
    // Links to other sites (e.g. *.netlify.app) open in a new tab.
    const external = !app.soon && new URL(app.href, location.href).origin !== location.origin;
    if (!app.soon) el.href = app.href;
    if (external) { el.target = '_blank'; el.rel = 'noopener'; }
    el.innerHTML = `<span class="ic"><svg viewBox="0 0 24 24">${app.icon}</svg></span>
      <h2></h2><p></p>${app.soon ? '' : `<span class="go">Open ${external ? '↗' : '→'}</span>`}`;
    el.querySelector('h2').textContent = app.title;
    el.querySelector('p').textContent = app.desc;
    grid.appendChild(el);
  }

  document.getElementById('signout').addEventListener('click', () => SiteAuth.signOut());
  window.__user.then(user => {
    if (!user) return;
    document.getElementById('email').textContent = user.email;
    document.getElementById('hello').textContent = 'Welcome back';
  });
})();
</script>
</body>
</html>
