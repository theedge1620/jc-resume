<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Jason Carneal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="static/favicon64.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Capture the auth redirect hash (#type=recovery…) before Supabase consumes it -->
  <script>window.__authHash = location.hash;</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="auth/config.js"></script>
  <script src="auth/auth.js"></script>

<style>
:root{
  --bg:      #050B12;
  --bg-2:    #0A1622;
  --ink:     #E6EEF4;
  --ink-2:   #A9BBCA;
  --ink-3:   #6F8597;
  --line:    rgba(79,163,255,.22);
  --accent:  #4FA3FF;
  --accent-2:#9CCBFF;
  --teal:    #38BDA6;
  --laser:   #FF3358;
  --proton:  #FF5470;
  --neutron: #8FB8DE;
  --panel:   rgba(9,20,31,.74);
  --err:     #FF8095;
  --ok:      #5FD3B8;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100%;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; color:var(--ink);
  background:radial-gradient(ellipse at 30% 45%, var(--bg-2) 0%, var(--bg) 70%) fixed, var(--bg);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Scope canvas (sonar + laser) ---------- */
#scope{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- Layout ---------- */
.wrap{
  position:relative; z-index:1; min-height:100vh; min-height:100dvh;
  display:grid; grid-template-columns:1fr minmax(340px,420px);
  align-items:center; gap:48px;
  max-width:1200px; margin:0 auto; padding:48px 40px;
}
.stage{display:grid;place-items:center;gap:22px;text-align:center}
.brand{position:fixed;top:22px;left:28px;z-index:2;display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.brand b{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;color:var(--accent-2);font-weight:500;letter-spacing:0}
.hud{position:fixed;left:28px;bottom:20px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;display:flex;gap:18px}
.hud span em{font-style:normal;color:var(--accent-2)}
.hud .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--laser);margin-right:8px;vertical-align:1px;box-shadow:0 0 8px var(--laser);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- Atom ---------- */
#atom{width:clamp(200px,26vw,330px);height:auto;overflow:visible;filter:drop-shadow(0 0 24px rgba(79,163,255,.25))}
#atom .orbit{fill:none;stroke:rgba(116,180,255,.5);stroke-width:1.1}
#atom .orbit-glow{fill:none;stroke:rgba(79,163,255,.18);stroke-width:5}
#atom .e{fill:#D6ECFF}
#atom .p{fill:var(--proton)}
#atom .n{fill:var(--neutron)}
#atom .halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:1}70%{transform:scale(1.25);opacity:.35}100%{transform:scale(.8);opacity:1}}
.tagline h1{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.01em}
.tagline p{margin:6px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- Panel ---------- */
.panel{
  position:relative; overflow:hidden;
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:32px 30px 26px;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
}
/* corner brackets */
.panel::before{content:"";position:absolute;inset:10px;pointer-events:none;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/14px 1px,
    linear-gradient(var(--accent),var(--accent)) top left/1px 14px,
    linear-gradient(var(--accent),var(--accent)) top right/14px 1px,
    linear-gradient(var(--accent),var(--accent)) top right/1px 14px,
    linear-gradient(var(--accent),var(--accent)) bottom left/14px 1px,
    linear-gradient(var(--accent),var(--accent)) bottom left/1px 14px,
    linear-gradient(var(--accent),var(--accent)) bottom right/14px 1px,
    linear-gradient(var(--accent),var(--accent)) bottom right/1px 14px;
  background-repeat:no-repeat; opacity:.7}
/* laser scan line */
.scan{position:absolute;left:0;right:0;top:0;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--laser) 20%,#fff 50%,var(--laser) 80%,transparent);
  box-shadow:0 0 12px 2px rgba(255,51,88,.55), 0 0 40px 6px rgba(255,51,88,.2);
  opacity:0; animation:scan 6s cubic-bezier(.45,0,.55,1) infinite 1s}
@keyframes scan{0%{transform:translateY(0);opacity:0}4%{opacity:.9}36%{opacity:.9}40%{transform:translateY(var(--h,480px));opacity:0}100%{transform:translateY(var(--h,480px));opacity:0}}
.panel.busy .scan{animation:scanfast .9s ease-in-out infinite alternate}
@keyframes scanfast{from{transform:translateY(0);opacity:.95}to{transform:translateY(var(--h,480px));opacity:.95}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:1px;background:currentColor}
.panel h2{margin:10px 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.panel .sub{margin:0 0 22px;color:var(--ink-2);font-size:14.5px}

form{display:grid;gap:14px}
form[hidden]{display:none}
label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.field{position:relative}
input[type=email],input[type=password],input[type=text]{
  width:100%; padding:12px 14px; border-radius:10px;
  background:rgba(3,10,17,.7); border:1px solid rgba(116,180,255,.22);
  color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
}
input::placeholder{color:#4f6476}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,163,255,.18)}
.field input{padding-right:64px}
.peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-radius:6px}
.peek:hover{color:var(--accent-2)}
.go{
  margin-top:6px; padding:13px 16px; border:0; border-radius:10px; cursor:pointer;
  background:linear-gradient(180deg,#3d95f5,#1F7AE0); color:#fff; font-weight:600; letter-spacing:.01em;
  box-shadow:0 8px 24px rgba(31,122,224,.35), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .12s, box-shadow .15s, opacity .15s;
}
.go:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(31,122,224,.45), inset 0 1px 0 rgba(255,255,255,.2)}
.go:disabled{opacity:.55;cursor:default;transform:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--accent-2);font-size:13.5px}
.link:hover{text-decoration:underline}
.msg{min-height:1.4em;margin:14px 0 0;font-size:13.5px;color:var(--ink-2)}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.notice{margin:0 0 18px;padding:10px 12px;border-radius:10px;font-size:13px;
  background:rgba(255,128,149,.08);border:1px solid rgba(255,128,149,.35);color:#ffc2cd}
.notice code{font-family:var(--mono);font-size:12px}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid rgba(116,180,255,.12);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}

/* ---------- Small screens ---------- */
@media (max-width: 900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding:72px 16px 24px;align-content:start;min-height:0}
  #atom{width:180px}
  .panel{padding:26px 20px 22px;max-width:440px;width:100%;margin:0 auto}
  .brand{top:16px;left:16px}
  .hud{position:relative;left:auto;bottom:auto;justify-content:center;gap:12px;padding:8px 16px 24px}
  .hud .opt{display:none}
}
</style>
</head>
<body>
<canvas id="scope" aria-hidden="true"></canvas>

<div class="brand"><b>JC</b>Secure access</div>

<main class="wrap">
  <section class="stage" aria-hidden="true">
    <svg id="atom" viewBox="-130 -130 260 260">
      <defs>
        <radialGradient id="halo-g">
          <stop offset="0" stop-color="#4FA3FF" stop-opacity=".55"/>
          <stop offset=".45" stop-color="#4FA3FF" stop-opacity=".16"/>
          <stop offset="1" stop-color="#4FA3FF" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="orbit" d="M-114 0a114 40 0 1 0 228 0a114 40 0 1 0-228 0"/>
      </defs>

      <circle class="halo" r="62" fill="url(#halo-g)"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
        <g transform="rotate(0)">
          <use href="#orbit" class="orbit-glow"/><use href="#orbit" class="orbit"/>
          <circle class="e" r="5" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
        </g>
        <g transform="rotate(60)">
          <use href="#orbit" class="orbit-glow"/><use href="#orbit" class="orbit"/>
          <circle class="e" r="5" filter="url(#glow)"><animateMotion dur="3.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
        </g>
        <g transform="rotate(120)">
          <use href="#orbit" class="orbit-glow"/><use href="#orbit" class="orbit"/>
          <circle class="e" r="5" filter="url(#glow)"><animateMotion dur="4.2s" begin="-2.5s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
        </g>
      </g>

      <g filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite"/>
        <circle class="n" cx="-9" cy="-7" r="9"/>
        <circle class="p" cx="9"  cy="-8" r="9"/>
        <circle class="n" cx="12" cy="7"  r="9"/>
        <circle class="p" cx="-11" cy="8" r="9"/>
        <circle class="n" cx="0"  cy="13" r="9"/>
        <circle class="p" cx="1"  cy="-15" r="9"/>
        <circle class="p" cx="0"  cy="0"  r="9.5"/>
      </g>
    </svg>
    <div class="tagline">
      <h1>Jason Carneal</h1>
      <p>Portfolio &amp; tools</p>
    </div>
  </section>

  <section class="panel" id="panel" aria-labelledby="title">
    <div class="scan" aria-hidden="true"></div>

    <div class="eyebrow" id="eyebrow">Restricted access</div>
    <h2 id="title">Sign in</h2>
    <p class="sub" id="sub">Use the account you were invited with.</p>

    <p class="notice" id="notice" hidden>
      Supabase isn't configured yet. Add your project URL and anon key to <code>auth/config.js</code>.
    </p>

    <!-- Sign in -->
    <form id="f-signin" novalidate>
      <label>Email
        <input type="email" name="email" autocomplete="username" required placeholder="you@example.com">
      </label>
      <label>Password
        <span class="field">
          <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" class="peek" aria-label="Show password">Show</button>
        </span>
      </label>
      <button class="go" type="submit">Sign in</button>
      <div class="row">
        <button type="button" class="link" data-view="forgot">Forgot password?</button>
        <button type="button" class="link" data-view="signup" hidden>Create account</button>
      </div>
    </form>

    <!-- Sign up (only when config.allowSignup) -->
    <form id="f-signup" novalidate hidden>
      <label>Email
        <input type="email" name="email" autocomplete="username" required placeholder="you@example.com">
      </label>
      <label>Password <span style="color:var(--ink-3);font-weight:400">(8+ characters)</span>
        <span class="field">
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="peek" aria-label="Show password">Show</button>
        </span>
      </label>
      <button class="go" type="submit">Create account</button>
      <div class="row"><button type="button" class="link" data-view="signin">← Back to sign in</button></div>
    </form>

    <!-- Forgot password -->
    <form id="f-forgot" novalidate hidden>
      <label>Email
        <input type="email" name="email" autocomplete="username" required placeholder="you@example.com">
      </label>
      <button class="go" type="submit">Send reset link</button>
      <div class="row"><button type="button" class="link" data-view="signin">← Back to sign in</button></div>
    </form>

    <!-- Set new password (recovery / invite links land here) -->
    <form id="f-reset" novalidate hidden>
      <label>New password <span style="color:var(--ink-3);font-weight:400">(8+ characters)</span>
        <span class="field">
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="peek" aria-label="Show password">Show</button>
        </span>
      </label>
      <label>Confirm password
        <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
      </label>
      <button class="go" type="submit">Save password &amp; continue</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <div class="foot"><span>Restricted authorization</span><span id="clock">--:--:--</span></div>
  </section>
</main>

<div class="hud" aria-hidden="true">
  <span class="live">Sonar active</span>
  <span>BRG <em id="brg">000.0°</em></span>
  <span class="opt">Contacts <em id="cts">00</em></span>
</div>

<script>
/* =================================================================
   Auth flow
================================================================= */
(() => {
  const A = window.SiteAuth;
  const $ = (s, r = document) => r.querySelector(s);
  const panel = $('#panel'), msg = $('#msg');
  const next = A.safeNext(new URLSearchParams(location.search).get('next'));
  const hash = new URLSearchParams((window.__authHash || '').replace(/^#/, ''));
  const linkType = hash.get('type');              // recovery | invite | signup | magiclink
  const linkErr  = hash.get('error_description');

  const views = {
    signin: { form: '#f-signin', eyebrow: 'Restricted access', title: 'Sign in', sub: 'Use the account you were invited with.' },
    signup: { form: '#f-signup', eyebrow: 'New account',       title: 'Create account', sub: 'You\'ll get an email to confirm your address.' },
    forgot: { form: '#f-forgot', eyebrow: 'Account recovery',  title: 'Reset password', sub: 'We\'ll email you a link to set a new password.' },
    reset:  { form: '#f-reset',  eyebrow: 'Credentials',       title: 'Set your password', sub: 'Choose a password for future sign-ins.' },
  };
  function show(name) {
    const v = views[name];
    Object.values(views).forEach(o => $(o.form).hidden = o !== v);
    $('#eyebrow').textContent = v.eyebrow; $('#title').textContent = v.title; $('#sub').textContent = v.sub;
    say('');
    const first = $(v.form).querySelector('input'); if (first) first.focus({ preventScroll: true });
  }
  function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
  function busy(form, on) {
    panel.classList.toggle('busy', on);
    form.querySelectorAll('input,button').forEach(el => el.disabled = on);
  }
  // scan line travels the full panel height
  const sizeScan = () => panel.style.setProperty('--h', panel.offsetHeight + 'px');
  new ResizeObserver(sizeScan).observe(panel);

  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));
  document.querySelectorAll('.peek').forEach(b => b.addEventListener('click', () => {
    const inp = b.previousElementSibling, hidden = inp.type === 'password';
    inp.type = hidden ? 'text' : 'password';
    b.textContent = hidden ? 'Hide' : 'Show';
    b.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  }));
  if (A.config.allowSignup) $('[data-view="signup"]').hidden = false;

  setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString([], { hour12: false }); }, 1000);

  if (!A.client) {
    $('#notice').hidden = false;
    document.querySelectorAll('form input, form .go').forEach(el => el.disabled = true);
    return;
  }
  const auth = A.client.auth;
  const go = () => setTimeout(() => location.replace(next), 650);  // let the scan finish a pass

  // Arrival state
  (async () => {
    if (linkErr) { say(linkErr.replace(/\+/g, ' '), 'err'); return; }
    const user = await A.getUser();
    if (linkType === 'recovery' || linkType === 'invite') {
      if (user) { show('reset'); return; }
    } else if (user) {
      say('Session found — redirecting…', 'ok'); panel.classList.add('busy'); go(); return;
    }
    if (linkType === 'signup') say('Email confirmed. You can sign in now.', 'ok');
  })();
  auth.onAuthStateChange((evt) => { if (evt === 'PASSWORD_RECOVERY') show('reset'); });

  const val = (f, n) => f.elements[n].value.trim();
  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

  $('#f-signin').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.currentTarget;
    const email = val(f, 'email'), password = f.elements.password.value;
    if (!emailOk(email) || !password) return say('Enter your email and password.', 'err');
    busy(f, true); say('Verifying credentials…');
    const { error } = await auth.signInWithPassword({ email, password });
    if (error) { busy(f, false); return say(error.message === 'Invalid login credentials' ? 'Email or password is incorrect.' : error.message, 'err'); }
    say('Access granted.', 'ok'); go();
  });

  $('#f-signup').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.currentTarget;
    const email = val(f, 'email'), password = f.elements.password.value;
    if (!emailOk(email)) return say('Enter a valid email.', 'err');
    if (password.length < 8) return say('Password must be at least 8 characters.', 'err');
    busy(f, true); say('Creating account…');
    const { data, error } = await auth.signUp({ email, password, options: { emailRedirectTo: A.LOGIN } });
    busy(f, false);
    if (error) return say(error.message, 'err');
    if (data.session) { say('Account created.', 'ok'); return go(); }
    say('Check your inbox to confirm your email, then sign in.', 'ok');
  });

  $('#f-forgot').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.currentTarget;
    const email = val(f, 'email');
    if (!emailOk(email)) return say('Enter a valid email.', 'err');
    busy(f, true); say('Sending…');
    const { error } = await auth.resetPasswordForEmail(email, { redirectTo: A.LOGIN });
    busy(f, false);
    if (error) return say(error.message, 'err');
    say('If that address has an account, a reset link is on its way.', 'ok');
  });

  $('#f-reset').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.currentTarget;
    const pw = f.elements.password.value, pw2 = f.elements.confirm.value;
    if (pw.length < 8) return say('Password must be at least 8 characters.', 'err');
    if (pw !== pw2) return say('Passwords don\'t match.', 'err');
    busy(f, true); say('Saving…');
    const { error } = await auth.updateUser({ password: pw });
    if (error) { busy(f, false); return say(error.message, 'err'); }
    say('Password saved.', 'ok'); go();
  });
})();

/* =================================================================
   Scope: sonar pings + rotating laser + contacts, centred on the atom
================================================================= */
(() => {
  const cv = document.getElementById('scope'), ctx = cv.getContext('2d');
  const atom = document.getElementById('atom');
  const brg = document.getElementById('brg'), cts = document.getElementById('cts');
  const TAU = Math.PI * 2;
  const PING_EVERY = 2.4, PING_LIFE = 5.2, SWEEP = 7;   // seconds
  const LASER = '255,51,88', SONAR = '79,163,255', TEAL = '56,189,166';
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); addEventListener('resize', resize);

  // Contacts in polar coords (distance is a fraction of reach)
  const contacts = Array.from({ length: 22 }, () => ({
    a: Math.random() * TAU, d: .22 + Math.random() * .72, lit: 0, s: 1.5 + Math.random() * 1.8,
  }));
  let pings = [], lastPing = -PING_EVERY, prevA = 0, lastHud = 0, lastT = 0;
  const t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000, dt = Math.min(t - lastT, .1); lastT = t;
    const r = atom.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, r0 = r.width * .42;
    const reach = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy));
    const a = ((t / SWEEP) * TAU) % TAU;

    ctx.clearRect(0, 0, W, H);

    // Range rings + crosshair + bearing ticks
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 6]);
    ctx.strokeStyle = `rgba(${SONAR},.10)`;
    for (let rr = r0 + 90; rr < reach; rr += 130) { ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.strokeStyle = `rgba(${SONAR},.06)`;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
    const tr = r0 + 220;
    ctx.strokeStyle = `rgba(${SONAR},.16)`;
    ctx.beginPath();
    for (let deg = 0; deg < 360; deg += 5) {
      const th = deg * Math.PI / 180, len = deg % 30 ? 5 : 12;
      ctx.moveTo(cx + Math.cos(th) * tr, cy + Math.sin(th) * tr);
      ctx.lineTo(cx + Math.cos(th) * (tr + len), cy + Math.sin(th) * (tr + len));
    }
    ctx.stroke();

    // Sweep wedge trailing the laser
    const wedge = 0.9;
    if (ctx.createConicGradient) {
      const g = ctx.createConicGradient(a - wedge, cx, cy);
      g.addColorStop(0, `rgba(${LASER},0)`);
      g.addColorStop(wedge / TAU, `rgba(${LASER},.16)`);
      g.addColorStop(wedge / TAU + .0001, `rgba(${LASER},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, reach, a - wedge, a); ctx.closePath(); ctx.fill();
    }

    // Sonar pings (synced with the nucleus pulse)
    if (t - lastPing >= PING_EVERY) { pings.push(t); lastPing = t; }
    pings = pings.filter(b => t - b < PING_LIFE);
    for (const b of pings) {
      const p = (t - b) / PING_LIFE, ease = 1 - Math.pow(1 - p, 2.2);
      const rad = r0 + ease * (reach - r0), al = Math.pow(1 - p, 1.6);
      ctx.strokeStyle = `rgba(${SONAR},${al * .18})`; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(${SONAR},${al * .7})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, TAU); ctx.stroke();
    }

    // Contacts light up as the laser crosses them
    const crossed = (ca) => prevA <= a ? (ca > prevA && ca <= a) : (ca > prevA || ca <= a);
    let litCount = 0;
    for (const c of contacts) {
      if (crossed(c.a)) c.lit = 1;
      c.lit = Math.max(0, c.lit - dt / 3.2);
      if (c.lit > .15) litCount++;
      const x = cx + Math.cos(c.a) * c.d * reach, y = cy + Math.sin(c.a) * c.d * reach;
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      if (c.lit > 0) {
        ctx.fillStyle = `rgba(${TEAL},${c.lit * .25})`;
        ctx.beginPath(); ctx.arc(x, y, c.s * 4 + (1 - c.lit) * 10, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = `rgba(${TEAL},${.12 + c.lit * .85})`;
      ctx.beginPath(); ctx.arc(x, y, c.s, 0, TAU); ctx.fill();
    }
    prevA = a;

    // Laser beam: glow + core, additive
    const ex = cx + Math.cos(a) * reach, ey = cy + Math.sin(a) * reach;
    const sx = cx + Math.cos(a) * r0 * .55, sy = cy + Math.sin(a) * r0 * .55;
    const flick = .85 + Math.random() * .15;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(sx, sy, ex, ey);
    lg.addColorStop(0, `rgba(${LASER},${.9 * flick})`); lg.addColorStop(.6, `rgba(${LASER},.35)`); lg.addColorStop(1, `rgba(${LASER},0)`);
    [[10, .12], [4, .35], [1.4, 1]].forEach(([w, o]) => {
      ctx.globalAlpha = o; ctx.strokeStyle = lg; ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    });
    ctx.globalAlpha = .9;
    ctx.strokeStyle = 'rgba(255,230,235,.9)'; ctx.lineWidth = .6;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a) * 160, sy + Math.sin(a) * 160); ctx.stroke();
    ctx.restore();

    if (now - lastHud > 100) {
      lastHud = now;
      brg.textContent = (((a * 180 / Math.PI) + 90) % 360).toFixed(1).padStart(5, '0') + '°';
      cts.textContent = String(litCount).padStart(2, '0');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
